; Per-task PLAYGROUND startup scene (owner direction 2026-07-28; piloted
; 2026-07-30). The agent should open into a usable scene rather than the
; engine's empty template map, so it can get to work on the actual test.
;
; This fragment is VERIFIER-OWNED and lives outside the UE project: it is
; append-applied onto Config/DefaultEngine.ini before a live-editor drive and
; reverted BYTE-IDENTICALLY afterwards (tools/verify-single/config_overlay.py),
; and Config/ stays agent-denied, so the overlay never widens the agent's
; writable surface. UE ini semantics are later-wins for scalar keys, so this
; appended value overrides the substrate default.
;
; The level itself lives under Content/Maps/<task-id>/ - a per-task root the
; fairness layer prunes, and an agent-DENY prefix, so no grader reads it and
; the task's own Content/Tasks/<id>/ deliverable folder is untouched (which is
; what keeps the scope-pinned rows safe).
[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/Maps/t2-consistent-enum-names/L_Playground.L_Playground
