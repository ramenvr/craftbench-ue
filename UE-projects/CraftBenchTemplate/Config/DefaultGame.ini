; GAS: specify a GameplayCue search path so the AbilitySystem does not log the
; "No GameplayCueNotifyPaths were specified ... falling back to all of /Game/"
; warning when the ASC lazily initializes its cue manager. The functional-test
; framework captures that warning during a test window and fails the test, so
; silencing it at the root keeps GAS-task verdicts clean. CraftBench abilities do
; not ship GameplayCueNotifies; this path simply scopes (and quiets) the scan.

[/Script/GameplayAbilities.AbilitySystemGlobals]
+GameplayCueNotifyPaths="/Game"

